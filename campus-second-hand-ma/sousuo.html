<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索闲置</title>
    <script>
        const q = new URLSearchParams(location.search).get("q") || "";
        location.replace(`./index.html#/search${q ? `?q=${encodeURIComponent(q)}` : ""}`);
    </script>
</head>
<body>正在进入搜索页...</body>
</html>
