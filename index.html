<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffdc00">
    <meta name="description" content="面向校园同学的二手闲置交易平台，支持发布、搜索、聊天和 AI 购买建议。">
    <title>校园二手</title>
    <link rel="preload" href="./css/app.css?v=66" as="style">
    <link rel="stylesheet" href="./css/app.css?v=66">
    <script src="./js/config.js?v=66"></script>
    <script src="./js/app.js?v=66" defer></script>
</head>
<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <header class="topbar" data-topbar>
        <a class="brand" href="#/" aria-label="回到首页">
            <span class="brand-word">二手</span>
        </a>

        <form class="top-search" data-search-form role="search">
            <label class="sr-only" for="globalSearch">搜索校园闲置</label>
            <input id="globalSearch" name="q" type="search" autocomplete="off" placeholder="搜教材、耳机、台灯、自行车">
            <button type="submit" aria-label="搜索">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"></circle><path d="m15.7 15.7 4.1 4.1"></path></svg>
                <span>搜索</span>
            </button>
        </form>

        <div class="auth-chip" data-auth-chip></div>
    </header>

    <main id="app" class="app-shell" tabindex="-1" aria-live="polite"></main>

    <aside class="side-rail" aria-label="快捷工具">
        <a class="side-rail-primary" href="#/publish" aria-label="发布闲置">
            <span>卖</span>
            <b>发布闲置</b>
        </a>
        <a href="#/messages" aria-label="消息">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7.5 9.2c0-3 2.4-5.4 5.4-5.4h6.2c3 0 5.4 2.4 5.4 5.4v4.7c0 3-2.4 5.4-5.4 5.4h-4.4l-5.3 4.4c-.8.7-1.9.1-1.9-.9v-3.8c-2.2-.6-3.8-2.7-3.8-5.1V9.2Z"/><path d="M12.3 11.7h.1M16 11.7h.1M19.7 11.7h.1"/></svg>
            <b>消息</b>
        </a>
        <a href="#/mine" aria-label="我的">
            <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="9.2" y="3.8" width="13.6" height="24.4" rx="4"/><path d="M14.2 7.4h3.6M15.8 23.8h.4"/></svg>
            <b>我的</b>
        </a>
        <a class="back-top-link" href="#/" data-back-top aria-label="回顶部">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7.5 18.2 16 9.8l8.5 8.4"/><path d="M10.8 21.8h10.4"/><path d="M16 10.4v14"/></svg>
            <b>回顶部</b>
        </a>
    </aside>

    <div class="toast-stack" data-toasts aria-live="polite" aria-atomic="true"></div>
    <div class="modal-root" data-modal-root></div>

    <template id="loading-template">
        <section class="page page-loading">
            <div class="skeleton hero-skeleton"></div>
            <div class="skeleton-row">
                <span class="skeleton"></span>
                <span class="skeleton"></span>
                <span class="skeleton"></span>
            </div>
        </section>
    </template>
</body>
</html>
